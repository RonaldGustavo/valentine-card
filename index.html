<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
        <title>Love</title>

        <!-- Style CSS -->
        <link rel="stylesheet" href="./style.css">
    </head>
    <body>
        <h1 class="header-title">Hi My Ebi 💖</h1>
        <div class="envelope-wrapper">
            <div id="envelope" class="close">
                <div class="front flap"></div>
                <div class="front pocket"></div>
                <div class="letter">
                    <p class="words line1">Hi My Ebi,</p>
                    <p class="words line2">I’m so blessed to have you</p>
                    <p class="words line3">Love,</p>
                    <p class="words line4">Ronald</p>
                </div>
                <div class="heart-wrapper">
                    <div class="heart love1"></div>              
                    <div class="heart love2"></div>
                    <div class="heart love3"></div>
                </div>
            </div>
        </div>
        <div class="btn-container">
            <button id="yes-btn"">I Love You Too 💖</button>
            <div id="no-btn">I Didnt Love You 💔</div>
        </div>

        <div id="custom-modal" class="modal hidden">
            <div class="modal-content">
                <h2>🎉 Yay! 💖</h2>
                <p>Love You So Much!</p>
                <button id="close-modal">OK</button>
            </div>
        </div>
        
        
        <!-- Script JS -->
        <script src="./script.js"></script>
    </body>
</html>
